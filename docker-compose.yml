services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stonesync
      POSTGRES_USER: stonesync
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - stonesync-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stonesync -d stonesync"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: ./server
    container_name: stonesync-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/stonesync
      DB_USER: stonesync
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      STORAGE_PATH: /data/vault
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
    volumes:
      - stonesync-vault:/data/vault
    networks:
      - default
      - webproxy
    restart: unless-stopped

volumes:
  stonesync-postgres:
  stonesync-vault:

networks:
  webproxy:
    external: true
