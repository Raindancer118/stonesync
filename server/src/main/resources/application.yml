spring:
  application:
    name: stonesync-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stonesync}
    username: ${DB_USER:stonesync}
    password: ${DB_PASSWORD:stonesync}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
  # Without this, Spring builds absolute URLs (like the OAuth2 "{baseUrl}" redirect-uri
  # below) from the raw http:// connection Tomcat sees, ignoring the X-Forwarded-Proto
  # header the reverse proxy sets - which sends Authentik an http:// redirect_uri and
  # gets the whole login flow rejected with 400 (found via a real invite-link test
  # against the live server after Phase 3 deploy).
  forward-headers-strategy: framework

stonesync:
  ticket:
    ttl-seconds: 15
  sync:
    snapshot-threshold-count: 200
    snapshot-threshold-bytes: 524288
  storage:
    path: ${STORAGE_PATH:/data/vault}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    vault-name: ${BOOTSTRAP_VAULT_NAME:Default Vault}
    device-name: ${BOOTSTRAP_DEVICE_NAME:bootstrap}
  public:
    url: ${PUBLIC_URL:}

logging:
  level:
    # AppLog uses a single shared logger named "stonesync" everywhere, rather than one
    # per class - this is the one place to control it. INFO by default: meaningful lifecycle
    # events (user/vault/document created, invite redeemed, restore performed, ...) are
    # visible, high-frequency/internal detail (every WS connect, every log-append, every
    # access check) stays at DEBUG and is silent unless explicitly turned up.
    stonesync: INFO
