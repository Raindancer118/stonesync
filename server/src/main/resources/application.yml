spring:
  application:
    name: stonesync-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stonesync}
    username: ${DB_USER:stonesync}
    password: ${DB_PASSWORD:stonesync}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          authentik:
            client-id: ${AUTHENTIK_CLIENT_ID:}
            client-secret: ${AUTHENTIK_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,email,profile
        provider:
          authentik:
            # Explicit endpoint URLs rather than `issuer-uri` auto-discovery: Authentik's
            # well-known discovery document reports every endpoint as http:// instead of
            # https:// (a known, pre-existing bug unrelated to this project - see
            # servers/dorn.md), which would make Spring try to reach the wrong scheme.
            authorization-uri: ${AUTHENTIK_AUTHORIZE_URI:https://portal.tstieh.de/application/o/authorize/}
            token-uri: ${AUTHENTIK_TOKEN_URI:https://portal.tstieh.de/application/o/token/}
            user-info-uri: ${AUTHENTIK_USERINFO_URI:https://portal.tstieh.de/application/o/userinfo/}
            jwk-set-uri: ${AUTHENTIK_JWKS_URI:https://portal.tstieh.de/application/o/stonesync/jwks/}
            user-name-attribute: email

server:
  port: ${SERVER_PORT:8080}
  # Without this, Spring builds absolute URLs (like the OAuth2 "{baseUrl}" redirect-uri
  # below) from the raw http:// connection Tomcat sees, ignoring the X-Forwarded-Proto
  # header the reverse proxy sets - which sends Authentik an http:// redirect_uri and
  # gets the whole login flow rejected with 400 (found via a real invite-link test
  # against the live server after Phase 3 deploy).
  forward-headers-strategy: framework

stonesync:
  ticket:
    ttl-seconds: 15
  sync:
    snapshot-threshold-count: 200
    snapshot-threshold-bytes: 524288
  storage:
    path: ${STORAGE_PATH:/data/vault}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    vault-name: ${BOOTSTRAP_VAULT_NAME:Default Vault}
    device-name: ${BOOTSTRAP_DEVICE_NAME:bootstrap}
  public:
    url: ${PUBLIC_URL:}

logging:
  level:
    de.tstieh.stonesync: INFO
