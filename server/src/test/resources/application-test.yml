spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      client:
        registration:
          authentik:
            # Test-only stub: OAuth2ClientAutoConfiguration refuses to start with an empty
            # client-id (see application.yml's ${AUTHENTIK_CLIENT_ID:} default), which would
            # otherwise fail every @SpringBootTest's context load. Never used to reach a real
            # Authentik instance in tests.
            client-id: test-client-id
            client-secret: test-client-secret

stonesync:
  ticket:
    ttl-seconds: 15
  sync:
    snapshot-threshold-count: 200
    snapshot-threshold-bytes: 524288
  storage:
    path: ${java.io.tmpdir:/tmp}/stonesync-test
